{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - MediCare</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        background: linear-gradient(135deg, #00d2ff, #4a00e0);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .login-container {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(15px);
        padding: 2rem;
        border-radius: 20px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      }

      .login-container h2 {
        color: #fff;
        text-align: center;
        margin-bottom: 2rem;
        font-size: 2rem;
      }

      .form-group {
        margin-bottom: 1rem;
      }

      .form-group label {
        display: block;
        color: #fff;
        margin-bottom: 0.5rem;
        font-weight: 500;
      }

      .form-group input {
        width: 100%;
        padding: 0.75rem;
        border: none;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
        font-size: 1rem;
      }

      .form-group input::placeholder {
        color: rgba(255, 255, 255, 0.7);
      }

      .login-btn {
        width: 100%;
        padding: 0.75rem;
        background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
        border: none;
        border-radius: 10px;
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        margin-top: 1rem;
        transition: transform 0.3s;
      }

      .login-btn:hover {
        transform: translateY(-2px);
      }

      .links {
        text-align: center;
        margin-top: 1rem;
      }

      .links a {
        color: #fff;
        text-decoration: none;
        margin: 0 1rem;
      }

      .links a:hover {
        text-decoration: underline;
      }

      .error {
        background: rgba(255, 0, 0, 0.2);
        color: #fff;
        padding: 0.5rem;
        border-radius: 5px;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <h2>MediCare Login</h2>

      {% if form.errors %}
      <div class="error">{{ form.errors }}</div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label for="id_username">Username:</label>
          {{ form.username }}
        </div>

        <div class="form-group">
          <label for="id_password">Password:</label>
          {{ form.password }}
        </div>

        <button type="submit" class="login-btn">Login</button>
      </form>

      <div class="links">
        <a href="{% url 'index' %}">← Back to Home</a>
        <a href="{% url 'patients:register' %}">Register</a>
      </div>
    </div>
  </body>
</html>
