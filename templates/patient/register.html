<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Patient Registration - MediCare</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1E88E5;
      --accent: #FDD835;
      --accent-hover: #fbc02d;
      --text-light: #ffffff;
      --text-dark: #1a1a1a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #f5f8fc;
      color: var(--text-dark);
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* Header */
    .reg-header {
      background-color: var(--primary);
      padding: 20px 40px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .reg-container {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .reg-logo {
      font-size: 28px;
      font-weight: 900;
      color: var(--text-light);
    }

    .reg-logo span {
      color: var(--accent);
    }

    .reg-nav {
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
    }

    .reg-nav a {
      color: var(--text-light);
      font-weight: 500;
      padding: 10px 14px;
      border-radius: 6px;
      transition: all 0.3s ease;
    }

    .reg-nav a:hover {
      background-color: rgba(255, 255, 255, 0.2);
      color: var(--accent);
    }

    .login-btn {
      background-color: var(--accent);
      color: #000;
      font-weight: 600;
      padding: 10px 20px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .login-btn:hover {
      background-color: var(--accent-hover);
      transform: scale(1.05);
    }

    /* Registration Section */
    .reg-section {
      padding: 60px 20px;
      background-color: #ffffff;
    }

    .reg-wrapper {
      max-width: 720px;
      margin: auto;
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .reg-title {
      font-size: 32px;
      font-weight: 900;
      color: var(--primary);
      margin-bottom: 10px;
    }

    .reg-subtitle {
      font-size: 16px;
      color: #666;
      margin-bottom: 30px;
    }

    .reg-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .reg-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .reg-group {
      text-align: left;
    }

    .reg-group label {
      font-weight: 600;
      margin-bottom: 8px;
      display: block;
    }

    .reg-group input,
    .reg-group textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: all 0.3s ease;
    }

    .reg-group input:hover,
    .reg-group textarea:hover {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(30, 136, 229, 0.15);
    }

    .reg-group input:focus,
    .reg-group textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(30, 136, 229, 0.2);
    }

    .reg-submit-btn {
      background-color: var(--primary);
      color: var(--text-light);
      padding: 12px 18px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.3s ease;
    }

    .reg-submit-btn:hover {
      background-color: #1565c0;
      transform: scale(1.03);
    }

    .reg-login-link {
      font-size: 14px;
      margin-top: 15px;
    }

    .reg-login-link a {
      color: var(--primary);
      font-weight: 600;
      cursor: pointer;
    }

    .reg-footer {
      text-align: center;
      padding: 20px;
      background-color: #e3f2fd;
      font-size: 14px;
      color: #333;
    }

    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .modal.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: #fff;
      padding: 2rem;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      position: relative;
      animation: fadeIn 0.4s ease-in-out;
    }

    @keyframes fadeIn {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-content h2 {
      text-align: center;
      margin-bottom: 20px;
      color: var(--primary);
    }

    .modal-content label {
      font-weight: 600;
      margin-top: 10px;
      display: block;
    }

    .modal-content input,
    .modal-content select {
      width: 100%;
      padding: 10px 12px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    .modal-content input:focus,
    .modal-content select:focus {
      border-color: var(--primary);
    }

    .modal-content button {
      margin-top: 20px;
      width: 100%;
      background-color: var(--accent);
      color: #000;
      padding: 12px;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.3s ease;
    }

    .modal-content button:hover {
      background-color: var(--accent-hover);
      transform: scale(1.03);
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 16px;
      font-size: 1.5rem;
      cursor: pointer;
      color: #000;
    }

    @media (max-width: 768px) {
      .reg-nav {
        justify-content: center;
        gap: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="reg-header">
    <div class="reg-container">
      <div class="reg-logo">Medi<span>Care</span></div>
      <nav class="reg-nav">
        <a href="../index.html">Home</a>
        <a href="../contact.html">Contact</a>
        <a href="../about.html">About</a>
        <button class="login-btn" id="loginBtn">Login</button>
      </nav>
    </div>
  </header>

  <!-- Registration Form -->
  <section class="reg-section">
    <div class="reg-wrapper">
      <h2 class="reg-title">📝 Patient Registration</h2>
      <p class="reg-subtitle">Fill in the details to create your account</p>

      <form action="#" method="POST" class="reg-form">
        <div class="reg-grid">
          <div class="reg-group">
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname" required />
          </div>
          <div class="reg-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
          </div>
          <div class="reg-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" required />
          </div>
          <div class="reg-group">
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob" required />
          </div>
          <div class="reg-group">
            <label for="address">Address</label>
            <textarea id="address" name="address" rows="2"></textarea>
          </div>
          <div class="reg-group">
            <label for="password">Create Password</label>
            <input type="password" id="password" name="password" required />
          </div>
        </div>

        <button type="submit" class="reg-submit-btn">Register</button>
        <p class="reg-login-link">Already have an account? <a id="loginLink">Login here</a></p>
      </form>
    </div>
  </section>

  <!-- Footer -->
  <footer class="reg-footer">
    <p>&copy; 2025 MediCare. All rights reserved.</p>
  </footer>

  <!-- Login Modal -->
  <div class="modal" id="loginModal">
    <div class="modal-content">
      <span class="close-btn" id="closeModal">&times;</span>
      <h2>Login to MediCare</h2>
      <form id="loginForm">
        <label for="userType">User Role</label>
        <select id="userType" required>
          <option value="">Select Role</option>
          <option value="admin">Admin</option>
          <option value="doctor">Doctor</option>
          <option value="patient">Patient</option>
        </select>
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" required />
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" required />
        <button type="submit">Login</button>
      </form>
    </div>
  </div>

  <!-- JavaScript -->
  <script>
    const loginBtn = document.getElementById('loginBtn');
    const loginLink = document.getElementById('loginLink');
    const modal = document.getElementById('loginModal');
    const closeBtn = document.getElementById('closeModal');

    loginBtn.onclick = () => modal.classList.add('show');
    loginLink.onclick = () => modal.classList.add('show');
    closeBtn.onclick = () => modal.classList.remove('show');

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const role = document.getElementById('userType').value;
      if (role === 'admin') window.location.href = "../admin/dashboard.html";
      else if (role === 'doctor') window.location.href = "../doctor/dashboard.html";
      else if (role === 'patient') window.location.href = "../patient/dashboard.html";
      else alert('Please select a role.');
    });
  </script>

</body>
</html>
